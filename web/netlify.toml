# Netlify hosting for the static build (docs/MULTIPLAYER.md §4). Deploy from this folder:
#   npm run build && npx netlify-cli deploy --prod --dir=dist
# A Git-connected Netlify site would set its base directory to `web`.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Vite fingerprints everything under assets/, so those files never change in place.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
