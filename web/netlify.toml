# Netlify hosting for the static build (docs/MULTIPLAYER.md §4). Deploy from this folder:
#   npm run deploy -- --deploy      (builds, keeps the last builds' assets live, publishes; see scripts/deploy.mjs)
# A Git-connected Netlify site would set its base directory to `web`.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Vite fingerprints everything under assets/, so those files never change in place.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The build's identity: running games poll it to learn of a new deploy, so it is never cached.
[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# The page itself always revalidates, so "Restart & Update" (and any reload) gets the new deploy.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
